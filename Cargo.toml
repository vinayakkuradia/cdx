[package]
name = "cdx"
version = "0.2.0"
edition = "2021"
description = "Fast, cross-platform interactive directory navigator"
license = "MIT"
readme = "README.md"

# The binary is named cdx-bin; a tiny shell function named `cdx` wraps it
# so the selected folder can actually change your shell's working directory.
[[bin]]
name = "cdx-bin"
path = "src/main.rs"

[dependencies]
crossterm = "0.28"

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
strip = true
# panic stays "unwind" on purpose: it lets the terminal guard restore your
# terminal even if something goes wrong.
